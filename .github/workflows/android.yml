name: Build TIBANSUB All-in-One APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout TIBANSUB source
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python protobuf
        run: pip install protobuf==3.20.3

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Pre-download OpenSSL source tarball for libchiaki
        run: |
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://mirror.math.princeton.edu/pub/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "http://mirrors.ibiblio.org/pub/openssl/source/old/1.1.1/openssl-1.1.1s.tar.gz" || \
          curl -fL --retry 5 -o openssl-1.1.1s.tar.gz "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1s/openssl-1.1.1s.tar.gz"
          cp openssl-1.1.1s.tar.gz app/ || true
          cp openssl-1.1.1s.tar.gz lib/ || true

      - name: Build Android TV Companion, Package Samsung WGT & Build TIBANSUB All-in-One APK
        run: ./gradlew :android-tv:assembleDebug :app:assembleDebug --stacktrace

      - name: Collect Release Artifacts
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          cp "$APK_FILE" dist/TIBANSUB.apk
          TV_APK_FILE=$(find android-tv/build/outputs/apk/ -name "*.apk" | head -n 1)
          cp "$TV_APK_FILE" dist/TIBANSUB-Android-TV.apk
          cp tizen-tv/TIBANSUB-Samsung-TV.wgt dist/TIBANSUB-Samsung-TV.wgt
          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TIBANSUB-AllInOne-Package
          path: |
            dist/*.apk
            dist/*.wgt

      - name: Read TIBANSUB version from app/build.gradle
        id: ver
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n 1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "TIBANSUB ${{ steps.ver.outputs.tag }} (PS5/PS4 + Xbox All-in-One Translator & Built-in TV Installer)"
          body: |
            ### 🎮 TIBANSUB ${{ steps.ver.outputs.tag }} — All-in-One Console Translator
            - **รองรับทั้ง PlayStation 5 / PS4 (`libchiaki`) และ Xbox Series X|S / One (`WebRTC`) ในแอปเดียว**
            - **ดีไซน์ใหม่ Glassy V20 × Liquid Glass Motion บนโทนสี Twilight-to-Sunset** พร้อมฟอนต์ `GTA Art Deco + Prompt`
            - **ฝังไฟล์ติดตั้งทีวีทั้ง Samsung (`.wgt` Auto-Sign) และ Android TV (`.apk` Wireless ADB) ไว้ในแอปมือถือครบจบในไฟล์เดียว**
            - **คงหน้าจอซับหลัก, กล่องข้อความแนะนำซ้าย, แชทมือถือขวา และเมนูขีดสามขีด (`☰`) แบบต้นฉบับครบ 100%**
          files: |
            dist/*.apk
            dist/*.wgt
          token: ${{ secrets.GITHUB_TOKEN }}
